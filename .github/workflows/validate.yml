name: Valider cstack
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - run: bun scripts/generate-facts.mjs --check
      - run: bun scripts/validate.ts
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bun test tests
      - run: bun install --frozen-lockfile
        working-directory: plugins/cstack/skills/cstack/scripts
      - run: bun run test
        working-directory: plugins/cstack/skills/cstack/scripts
      - run: bun run typecheck
        working-directory: plugins/cstack/skills/cstack/scripts
      - run: plugins/cstack/skills/cstack/scripts/node_modules/.bin/tsc -p tsconfig.json
      - run: bash -n plugins/cstack/scripts/run-tool.sh plugins/cstack/skills/cstack/scripts/worktree-audit.sh plugins/cstack/skills/show-me-your-work/scripts/log.sh
      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            --severity=warning \
            plugins/cstack/scripts/run-tool.sh \
            plugins/cstack/skills/cstack/scripts/worktree-audit.sh \
            plugins/cstack/skills/show-me-your-work/scripts/log.sh
      - name: Actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -no-color \
            .github/workflows/*.yml \
            plugins/cstack/automations/intake/templates/github-intake.yml
      - run: git diff --check
