name: Valider cstack
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - run: bun scripts/validate.ts
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bun test tests
      - run: bun install --frozen-lockfile
        working-directory: plugins/cstack/skills/cstack/scripts
      - run: bun run test
        working-directory: plugins/cstack/skills/cstack/scripts
      - run: bun run typecheck
        working-directory: plugins/cstack/skills/cstack/scripts
      - run: plugins/cstack/skills/cstack/scripts/node_modules/.bin/tsc -p tsconfig.json
      - run: bash -n plugins/cstack/scripts/run-tool.sh plugins/cstack/skills/cstack/scripts/worktree-audit.sh plugins/cstack/skills/show-me-your-work/scripts/log.sh
      - run: git diff --check
