interface:
  display_name: "cstack"
  short_description: "Route le travail et vérifie le résultat"
  default_prompt: "Utilise $cstack:cstack pour cette tâche. Pour une implémentation multi-phase, je demande un Goal natif global jusqu'à une PR testée et revue, sauf limite explicite de ma demande. Délègue le travail indépendant aux agents configurés, sous-agents natifs ou workers CLI, en parallèle."
policy:
  allow_implicit_invocation: false
